spring.application.name=trading_app
server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://postgres-db:5432/trading_app
spring.datasource.username=postgres
spring.datasource.password=user123
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql: true

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.timeout=60000ms

spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

management.endpoints.web.exposure.include=health,info,metrics,loggers,prometheus,caches
management.endpoints.health.show-details=always
management.endpoint.health.probes.enabled=true

stripe.api.key=your_stripe_api_key
razorpay.api.key=your_razorpay_api_key
stripe.api.secret=your_stripe_api_secret
razorpay.api.secret=your_razorpay_api_secret
